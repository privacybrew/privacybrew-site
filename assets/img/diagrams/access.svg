<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="360" height="160" role="img">
<title>A website must ask you before it uses your location, camera or microphone. Without asking, it can see if you have a camera and a microphone.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b6dd1"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8a87c"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fae96"/></marker>
</defs>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect x="6" y="34" width="96" height="50" rx="10" fill="#281a35" stroke="#3a2c4a" stroke-width="1.5"/>
<text x="54" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#f0eaf7">Website</text>
<line x1="106" y1="59" x2="140" y2="59" stroke="#9b6dd1" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/>
<text x="123" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#9b6dd1">asks</text>
<rect x="144" y="34" width="92" height="50" rx="10" fill="#281a35" stroke="#5fae96" stroke-width="1.5"/>
<text x="190" y="57" text-anchor="middle" font-size="14" font-weight="600" fill="#f0eaf7">You</text>
<text x="190" y="74" text-anchor="middle" font-size="12" fill="#b8a8c9">Allow or Block</text>
<line x1="240" y1="59" x2="258" y2="59" stroke="#5fae96" stroke-width="2" stroke-linecap="round" marker-end="url(#g)"/>
<rect x="262" y="12" width="92" height="24" rx="12" fill="none" stroke="#9b6dd1" stroke-width="1.5"/><text x="308" y="28" text-anchor="middle" font-size="12" font-weight="600" fill="#9b6dd1">Location</text>
<rect x="262" y="47" width="92" height="24" rx="12" fill="none" stroke="#9b6dd1" stroke-width="1.5"/><text x="308" y="63" text-anchor="middle" font-size="12" font-weight="600" fill="#9b6dd1">Camera</text>
<rect x="262" y="82" width="92" height="24" rx="12" fill="none" stroke="#9b6dd1" stroke-width="1.5"/><text x="308" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#9b6dd1">Microphone</text>
<line x1="54" y1="88" x2="54" y2="112" stroke="#e8a87c" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#o)"/>
<rect x="6" y="118" width="348" height="34" rx="10" fill="#281a35" stroke="#e8a87c" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="180" y="140" text-anchor="middle" font-size="12" fill="#f0eaf7"><tspan font-weight="700" fill="#e8a87c">Without asking:</tspan> has a camera? has a microphone?</text>
</g>
</svg>
