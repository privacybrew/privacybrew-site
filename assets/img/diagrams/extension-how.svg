<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 36 360 214" width="360" height="214" role="img">
<title>When you open a website, PrivacyBrew checks each request in your browser. It blocks trackers and ads, rejects cookie pop-ups and asks the website not to sell your data. Then it shows a report card.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b6dd1"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fae96"/></marker>
</defs>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect x="4" y="88" width="88" height="54" rx="10" fill="#281a35" stroke="#3a2c4a" stroke-width="1.5"/>
<text x="48" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#f0eaf7">Website</text>
<text x="48" y="129" text-anchor="middle" font-size="11" fill="#b8a8c9">you open</text>
<line x1="96" y1="115" x2="118" y2="115" stroke="#9b6dd1" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="122" y="70" width="96" height="90" rx="12" fill="#281a35" stroke="#5fae96" stroke-width="1.5"/>
<text x="170" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#f0eaf7">PrivacyBrew</text>
<text x="170" y="125" text-anchor="middle" font-size="11" fill="#b8a8c9">in your browser</text>
<path d="M222 115 H230 M240 65 H236 Q230 65 230 71 V159 Q230 165 236 165 H240" fill="none" stroke="#5fae96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="238" y1="65" x2="253" y2="65" stroke="#5fae96" stroke-width="2" stroke-linecap="round" marker-end="url(#g)"/>
<line x1="230" y1="115" x2="253" y2="115" stroke="#5fae96" stroke-width="2" stroke-linecap="round" marker-end="url(#g)"/>
<line x1="238" y1="165" x2="253" y2="165" stroke="#5fae96" stroke-width="2" stroke-linecap="round" marker-end="url(#g)"/>
<rect x="256" y="45" width="100" height="40" rx="10" fill="#281a35" stroke="#3a2c4a" stroke-width="1.5"/>
<text x="306" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#f0eaf7">Trackers, ads</text>
<text x="306" y="77" text-anchor="middle" font-size="11" fill="#5fae96">blocked</text>
<rect x="256" y="95" width="100" height="40" rx="10" fill="#281a35" stroke="#3a2c4a" stroke-width="1.5"/>
<text x="306" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#f0eaf7">Cookie pop-up</text>
<text x="306" y="127" text-anchor="middle" font-size="11" fill="#5fae96">rejected</text>
<rect x="256" y="145" width="100" height="40" rx="10" fill="#281a35" stroke="#3a2c4a" stroke-width="1.5"/>
<text x="306" y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#f0eaf7">Do not sell</text>
<text x="306" y="177" text-anchor="middle" font-size="11" fill="#5fae96">request sent</text>
<line x1="170" y1="164" x2="170" y2="194" stroke="#9b6dd1" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="104" y="198" width="132" height="46" rx="10" fill="#281a35" stroke="#9b6dd1" stroke-width="1.5"/>
<text x="170" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#f0eaf7">Report card</text>
<text x="170" y="234" text-anchor="middle" font-size="11" fill="#b8a8c9">for you only</text>
</g>
</svg>
