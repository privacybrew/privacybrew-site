<text x="182" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#f0eaf7">PrivacyBrew</text>
<text x="182" y="57" text-anchor="middle" font-size="11" fill="#b8a8c9">on your phone</text>
<line x1="236" y1="43" x2="258" y2="43" stroke="#9b6dd1" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="262" y="16" width="94" height="54" rx="10" fill="#281a35" stroke="#3a2c4a" stroke-width="1.5"/>
<text x="309" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#f0eaf7">Simple</text>
<text x="309" y="57" text-anchor="middle" font-size="14" font-weight="600" fill="#f0eaf7">answers</text>
<line x1="309" y1="74" x2="309" y2="104" stroke="#5fae96" stroke-width="2" stroke-linecap="round" marker-end="url(#g)"/>
