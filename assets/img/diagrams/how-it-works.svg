</defs>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect x="4" y="16" width="98" height="54" rx="10" fill="#281a35" stroke="#3a2c4a" stroke-width="1.5"/>
<text x="53" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#f0eaf7">Your apps</text>
<text x="53" y="57" text-anchor="middle" font-size="11" fill="#b8a8c9">and permissions</text>
