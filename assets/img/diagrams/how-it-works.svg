<path d="M175 84l14 14M189 84l-14 14" stroke="#e8a87c" stroke-width="2.5" stroke-linecap="round"/>
<rect x="132" y="108" width="100" height="46" rx="10" fill="none" stroke="#e8a87c" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="182" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#e8a87c">Internet</text>
<text x="182" y="145" text-anchor="middle" font-size="11" fill="#e8a87c">not used</text>
