<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 192" width="360" height="192" role="img">
<title>The same ad company is on Website A and Website B. Its cookie identifies you on both, so it knows that you visited A and B.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b6dd1"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8a87c"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fae96"/></marker>
</defs>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect x="10" y="10" width="140" height="70" rx="10" fill="#281a35" stroke="#3a2c4a" stroke-width="1.5"/><text x="80" y="32" text-anchor="middle" font-size="13" font-weight="600" fill="#f0eaf7">Website A</text><rect x="55" y="46" width="50" height="24" rx="12" fill="none" stroke="#e8a87c" stroke-width="1.5"/><text x="80.0" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#e8a87c">Ad</text><rect x="210" y="10" width="140" height="70" rx="10" fill="#281a35" stroke="#3a2c4a" stroke-width="1.5"/><text x="280" y="32" text-anchor="middle" font-size="13" font-weight="600" fill="#f0eaf7">Website B</text><rect x="255" y="46" width="50" height="24" rx="12" fill="none" stroke="#e8a87c" stroke-width="1.5"/><text x="280.0" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#e8a87c">Ad</text><line x1="80" y1="84" x2="150" y2="126" stroke="#e8a87c" stroke-width="2" stroke-linecap="round" marker-end="url(#o)"/><line x1="280" y1="84" x2="210" y2="126" stroke="#e8a87c" stroke-width="2" stroke-linecap="round" marker-end="url(#o)"/><text x="180" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#e8a87c">same cookie</text><rect x="110" y="132" width="140" height="52" rx="10" fill="#281a35" stroke="#e8a87c" stroke-width="1.5"/><text x="180.0" y="156.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0eaf7">Ad company</text><text x="180.0" y="173.0" text-anchor="middle" font-size="12" fill="#b8a8c9">knows: A, B</text>
</g>
</svg>
